# Documentation sync baseline.
# For each source repository, the last master commit whose changes the Zimlet
# documentation (documentation/ and the .agents/reference files) has been
# checked against. Changes after these commits are not yet reflected in the docs.
#
# Rules:
# - Record full commit SHAs from a shared branch (master), never from a feature branch.
# - Advance a SHA only after the changes up to it have been reviewed and the docs updated.
# - Do not add commit messages or commit dates here; some repositories are private.
# - Review new changes with `git -C <repo> log <commit>..HEAD`.
# - If a commit is missing locally or is not an ancestor of HEAD, warn and stop.
#   Do not guess a range and do not advance the baseline.
