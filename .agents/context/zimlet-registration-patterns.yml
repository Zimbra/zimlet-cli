      - id: factory-returned-object
        summary: return { init() {}, destroy() {} }.
        examples: [ zimbra-zimlet-slack ]
  - id: slot-behavior
    kind: registration
    name: Slot used for behavior, not visible UI
    api: plugins.register('slot::<name>', handler)
    status: complete
    summary: Register on a slot to run logic or change the host instead of showing UI of its own.
    usages:
      - { zimlet: zimbra-zimlet-attachment-missing-alert, registers: [ slot::mail-composer-toolbar-send ], variants: [ headless-component ] }
      - { zimlet: zimbra-zimlet-deceptive-link-detector, registers: [ slot::mail-pane ], variants: [ headless-component ] }
      - { zimlet: zimbra-zimlet-disable-screen-capture, registers: [ slot::print-link ], variants: [ suppress-host-item ] }
      - { zimlet: zimbra-zimlet-emptysubject, registers: [ slot::mail-composer-toolbar-send ], variants: [ headless-component ] }
    hostSide:
      reference: ../../../zm-x-web/.agents/zimlet/context/zimlet-slots.yml (kind zimlet-slot)
      doc: ../../../zm-x-web/.agents/zimlet/reference/slot-behavior.md
    recommendedExample:
      zimlet: zimbra-zimlet-disable-screen-capture
      reason: Shows the suppress-host-item variant in a single registration.
    variants:
      - id: headless-component
        summary: The handler renders a component that returns null and works through effects or events.
        examples: [ zimbra-zimlet-attachment-missing-alert, zimbra-zimlet-deceptive-link-detector, zimbra-zimlet-emptysubject ]
      - id: suppress-host-item
        summary: The handler returns an empty object so a removable host section renders nothing.
        examples: [ zimbra-zimlet-disable-screen-capture ]
    notes:
      - Only registrations whose component was checked to return null, or that return an empty object, are classified here. Others stay in slot-ui.
