# Zimlet registration patterns: how Zimlets register with Modern UI (zm-x-web).
# Entry point and conventions: ../reference/zimlet-registration-patterns.md
#
# Merge contract (scripts/scan-zimlet-registrations.mjs):
# - status "scanned": mechanical output; refreshed on every run.
# - status "complete": reviewed; the script never edits it and only reports drift.
# - Pattern usages of a complete pattern are append-only.
# Slot and key names are recorded as the zimlet registers them; they are not checked against
# the zm-x-web slot catalog.

version: 1
sources:
  repos:
    - id: zm-modern-zimlets
      dir: zimlets
    - id: zm-cloudsuite-zimlets
      dir: packages
  slotCatalog: ../../../zm-x-web/.agents/zimlet/context/zimlet-slots.yml
  slotCatalogRole: Reference only for the host side. Slot names here are not validated against it.
patterns:
  - id: slot-ui
    kind: registration
    name: Slot that renders UI
    api: plugins.register('slot::<name>', handler)
    status: complete
    summary: Fill a host slot with UI. The handler receives the slot props and returns what to render. The host renders every handler registered for the slot.
    usages:
      - { zimlet: zimbra-zimlet-ads, registers: [ "slot::${adSlots}" ], unregisters: [ "slot::${slot}" ], variants: [ component-reference ], files: [ src/components/initialize-ads/index.js ] }
      - { zimlet: zimbra-zimlet-calendar-subscription, registers: [ slot::calendar-subscription-menu, slot::calendar-subscription-modal-flow, slot::calendar-subscription-list ], variants: [ inline-handler, returns-render-function ] }
      - { zimlet: zimbra-zimlet-chat, registers: [ slot::rightside-zimlet-slot, slot::app, slot::contact-hover-card-details, slot::contact-card-item, slot::rightbar-50px ], unregisters: [ slot::rightside-zimlet-slot ], variants: [ component-reference, inline-handler ], files: [ src/components/app/index.js ] }
      - { zimlet: zimbra-zimlet-custom-fonts, registers: [ slot::custom-fonts ], variants: [ component-reference ] }
      - { zimlet: zimbra-zimlet-desktop-auto-update, registers: [ slot::app ], variants: [ inline-handler ] }
      - { zimlet: zimbra-zimlet-disable-screen-capture, registers: [ slot::app ], variants: [ inline-handler ] }
      - { zimlet: zimbra-zimlet-document-editor, registers: [ slot::briefcase-document-context-menu, slot::action-menu-briefcase-more, slot::briefcase-document-header-action, slot::email-attachment-action, slot::briefcase-upload-button ], variants: [ wrapper-component ] }
      - { zimlet: zimbra-zimlet-download-email, registers: [ slot::action-menu-mail-more ], variants: [ inline-handler ] }
      - { zimlet: zimbra-zimlet-email-defanger, registers: [ slot::message-body-top ], variants: [ inline-handler ] }
      - { zimlet: zimbra-zimlet-email-reminder, registers: [ slot::action-menu-mail-more ], variants: [ inline-handler ] }
      - { zimlet: zimbra-zimlet-email-templates, registers: [ slot::compose-sender-options-menu ], variants: [ component-reference ] }
      - { zimlet: zimbra-zimlet-external-setting-links, registers: [ slot::settings-dropdown-item-end, slot::header-menu-item ], variants: [ inline-handler ] }
      - { zimlet: zimbra-zimlet-import-export-ics, registers: [ slot::action-menu-event-more, slot::action-menu-event-context-menu, slot::email-attachment-action ], variants: [ inline-handler ] }
      - { zimlet: zimbra-zimlet-install-pwa, registers: [ slot::settings-dropdown-item ], variants: [ inline-handler ] }
      - { zimlet: zimbra-zimlet-mail-recall, registers: [ slot::mail-recall-menu-option ], variants: [ inline-handler ] }
      - { zimlet: zimbra-zimlet-mail-translate, registers: [ slot::mail-overflow-menu-option, slot::message-body-top, slot::message-header-additional-buttons ], variants: [ inline-handler ] }
      - { zimlet: zimbra-zimlet-modern-welcometour, registers: [ slot::app ], variants: [ inline-handler ] }
      - { zimlet: zimbra-zimlet-org-chart, registers: [ slot::web-search, slot::app ], unregisters: [ slot::web-search ], variants: [ component-reference, inline-handler ], files: [ src/components/register-search-bar/index.js ] }
      - { zimlet: zimbra-zimlet-personal-notes, registers: [ slot::message-body-top ], variants: [ inline-handler ] }
      - { zimlet: zimbra-zimlet-preventive-ooo, registers: [ slot::mail-header-wrapper, slot::attendees-chooser-attendees, slot::contact-input-token:button-inner-content, slot::contact-hover-card-details ], variants: [ wrapper-component, component-reference ] }
      - { zimlet: zimbra-zimlet-privacy-protector, registers: [ slot::mail-pane ], variants: [ inline-handler ] }
      - { zimlet: zimbra-zimlet-secure-mail, registers: [ slot::mail-composer-smime-dropdown, slot::mail-composer-toolbar-send, slot::message-smime-status, slot::contact-add-server-smime-cert ], variants: [ inline-handler ] }
      - { zimlet: zimbra-zimlet-set-default-client, registers: [ slot::set-default-client, slot::settings-dropdown-item-end ], variants: [ inline-handler ] }
      - { zimlet: zimbra-zimlet-sideloader, registers: [ slot::app ], variants: [ component-reference ] }
      - { zimlet: zimbra-zimlet-signature-template, registers: [ slot::composer ], variants: [ component-reference ] }
      - { zimlet: zimbra-zimlet-spy-blocker, registers: [ slot::message-body-top ], variants: [ inline-handler ] }
      - { zimlet: zimbra-zimlet-tlp, registers: [ slot::compose-sender-options-menu ], variants: [ wrapper-component ] }
      - { zimlet: zimbra-zimlet-user-feedback, registers: [ slot::gear-menu ], variants: [ component-reference ] }
      - { zimlet: zimbra-zimlet-voice-composer, registers: [ slot::app, slot::composer-toolbar-end ], variants: [ inline-handler ] }
      - { zimlet: zimbra-zimlet-web-search, registers: [ slot::web-search, slot::web-search-toggle ], unregisters: [ slot::web-search ], variants: [ component-reference, inline-handler ], files: [ src/components/web-search/toggle.js ] }
      - { zimlet: zimbra-zimlet-dropbox, registers: [ slot::collaboration-zimlet-collaboration-list, slot::collaboration-zimlet-collaboration-list-files, slot::attachment-items, slot::compose-attachment-action-menu, slot::attachment-single-action, slot::attachment-multi-action, slot::attachment-upload-and-link ], unregisters: [ slot::compose-attachment-action-menu, slot::attachment-single-action, slot::attachment-multi-action, slot::attachment-upload-and-link ], variants: [ component-reference, wrapper-component ] }
      - { zimlet: zimbra-zimlet-google-drive, registers: [ slot::collaboration-zimlet-collaboration-list, slot::collaboration-zimlet-collaboration-list-files, slot::compose-attachment-action-menu, slot::attachment-upload-and-link, slot::attachment-single-action, slot::attachment-multi-action ], unregisters: [ slot::compose-attachment-action-menu, slot::attachment-upload-and-link, slot::attachment-single-action, slot::attachment-multi-action ], variants: [ wrapper-component ] }
      - { zimlet: zimbra-zimlet-jitsi, registers: [ slot::calendar-appointment-edit-video-call, slot::collaboration-zimlet-collaboration-list-videos ], variants: [ component-reference ] }
      - { zimlet: zimbra-zimlet-onedrive, registers: [ slot::collaboration-zimlet-collaboration-list, slot::collaboration-zimlet-collaboration-list-files, slot::compose-attachment-action-menu, slot::attachment-single-action, slot::attachment-multi-action, slot::attachment-upload-and-link ], unregisters: [ slot::compose-attachment-action-menu, slot::attachment-single-action, slot::attachment-multi-action, slot::attachment-upload-and-link ], variants: [ component-reference, wrapper-component ] }
      - { zimlet: zimbra-zimlet-slack, registers: [ slot::contact-hover-card-details, slot::address-pill, slot::contact-card-item, slot::action-menu-mail-more, slot::contact-card-messages-and-files, slot::collaboration-zimlet-collaboration-list, slot::collaboration-zimlet-collaboration-list-chat ], variants: [ component-reference, inline-handler ] }
      - { zimlet: zimbra-zimlet-video-call-preferences, registers: [ slot::calendar-appointment-edit-video-call ], variants: [ component-reference ] }
      - { zimlet: zimbra-zimlet-zoom, registers: [ slot::calendar-body-end, slot::collaboration-zimlet-collaboration-list, slot::collaboration-zimlet-collaboration-list-videos, slot::calendar-appointment-edit-video-call ], unregisters: [ slot::calendar-appointment-edit-video-call ], variants: [ inline-handler, component-reference ] }
    hostSide:
      source: zm-x-web/src/components/zimlet-slot.js
      reference: ../../../zm-x-web/.agents/zimlet/context/zimlet-slots.yml (kind zimlet-slot)
      doc: ../../../zm-x-web/.agents/zimlet/reference/slot-behavior.md
    recommendedExample:
      zimlet: zimbra-zimlet-personal-notes
      reason: "Smallest complete example: one slot, one handler, the factory shape used by the template."
    variants:
      - id: inline-handler
        summary: Arrow function that receives slot props and returns an element.
        examples: [ zimbra-zimlet-user-feedback, zimbra-zimlet-calendar-subscription, zimbra-zimlet-chat, zimbra-zimlet-desktop-auto-update ]
      - id: component-reference
        summary: The component itself is passed as the handler.
        examples: [ zimbra-zimlet-ads, zimbra-zimlet-chat, zimbra-zimlet-custom-fonts, zimbra-zimlet-email-templates ]
      - id: wrapper-component
        summary: A local Wrapped* or Provided* component injects context, store or clients before rendering.
        examples: [ zimbra-zimlet-document-editor, zimbra-zimlet-preventive-ooo, zimbra-zimlet-tlp, zimbra-zimlet-dropbox ]
      - id: returns-render-function
        summary: The handler returns a function, which the slot turns into an element with the same props.
        examples: [ zimbra-zimlet-calendar-subscription ]
    notes:
      - Some slots, such as slot::app, are always mounted and receive host props; check the catalog entry for the props passed.
  - id: settings
    kind: registration
    name: Settings section or fields
    api: plugins.register('settings', { id, title, component, fields })
    status: complete
    summary: Add a section or fields to the Modern UI settings dialog. Uses the bare key 'settings'. The settings modal collects every registered object.
    usages:
      - { zimlet: zimbra-zimlet-attachment-missing-alert, registers: [ settings ], variants: [ extend-host-section ] }
      - { zimlet: zimbra-zimlet-custom-fonts, registers: [ settings ], variants: [ new-section-with-fields ] }
      - { zimlet: zimbra-zimlet-desktop-auto-update, registers: [ settings ], variants: [ new-section-with-fields ] }
      - { zimlet: zimbra-zimlet-privacy-protector, registers: [ settings ], variants: [ new-section ] }
      - { zimlet: zimbra-zimlet-secure-mail, registers: [ settings ], variants: [ new-section-with-fields ] }
      - { zimlet: zimbra-zimlet-user-sessions-management, registers: [ settings ], variants: [ new-section ] }
      - { zimlet: zimbra-zimlet-dropbox, registers: [ settings ], variants: [ new-section ] }
      - { zimlet: zimbra-zimlet-google-drive, registers: [ settings ], variants: [ new-section ] }
      - { zimlet: zimbra-zimlet-onedrive, registers: [ settings ], variants: [ new-section ] }
      - { zimlet: zimbra-zimlet-slack, registers: [ settings ], variants: [ new-section-with-fields ] }
      - { zimlet: zimbra-zimlet-video-call-preferences, registers: [ settings ], variants: [ extend-host-section ] }
      - { zimlet: zimbra-zimlet-zoom, registers: [ settings ], variants: [ new-section ] }
    hostSide:
      source: zm-x-web/src/components/settings-modal/settings-modal.js (loadSettingsFromZimlets)
      reference: ../../../zm-x-web/.agents/zimlet/context/zimlet-slots.yml (kind invoke-plugin, name settings)
      hostSections: zm-x-web/src/components/settings/constants.js (ids such as writingEmail, calendarAndReminders)
    recommendedExample:
      zimlet: zimbra-zimlet-attachment-missing-alert
      reason: Extends a host section with a field and also registers a companion slot, the combination most guides need.
    variants:
      - id: extend-host-section
        summary: No title or component. The id matches a host section and only fields are added.
        examples: [ zimbra-zimlet-attachment-missing-alert, zimbra-zimlet-video-call-preferences ]
      - id: new-section-with-fields
        summary: A new section with a title, a component and fields.
        examples: [ zimbra-zimlet-custom-fonts, zimbra-zimlet-desktop-auto-update, zimbra-zimlet-secure-mail, zimbra-zimlet-slack ]
      - id: new-section
        summary: A new section with a title and a component and no fields of its own.
        examples: [ zimbra-zimlet-privacy-protector, zimbra-zimlet-user-sessions-management, zimbra-zimlet-dropbox, zimbra-zimlet-google-drive ]
    notes:
      - "Field type values seen: userPref, modifyProperties, mailboxMetadata. Several zimlets build the field with a helper, recorded as helper."
      - video-call-preferences adds fromJS and toJS converters to a modifyProperties field.
      - Settings ids that are identifiers or member expressions are recorded as source text.
  - id: settings-companion-slot
    kind: registration
    name: Slot inside a host settings section
    api: plugins.register('slot::<settings slot>', handler)
    status: complete
    summary: Slot rendered inside a host settings panel. Use it to add UI to an existing section next to a settings registration.
    usages:
      - { zimlet: zimbra-zimlet-additional-signature-setting, registers: [ slot::additional-signature-settings ], variants: [ component-reference ] }
      - { zimlet: zimbra-zimlet-attachment-missing-alert, registers: [ slot::writting-email-additional-settings ], variants: [ inline-handler ] }
      - { zimlet: zimbra-zimlet-modern-welcometour, registers: [ slot::general-setting-bottom ], variants: [ inline-handler ] }
      - { zimlet: zimbra-zimlet-voice-composer, registers: [ slot::writing-email-post-composer-settings ], variants: [ inline-handler ] }
      - { zimlet: zimbra-zimlet-video-call-preferences, registers: [ slot::calendar-and-reminders-video-call-preferences ], variants: [ component-reference ] }
    hostSide:
      reference: ../../../zm-x-web/.agents/zimlet/context/zimlet-slots.yml (kind zimlet-slot)
      hostComponents:
        - zm-x-web/src/components/settings/writing-email-settings/index.js (writting-email-additional-settings, writing-email-post-composer-settings)
        - zm-x-web/src/components/settings/calendar-and-reminders-settings/index.js (calendar-and-reminders-video-call-preferences)
        - zm-x-web/src/components/settings/signatures-settings/index.js (additional-signature-settings)
        - zm-x-web/src/components/settings/general-settings/index.js (general-setting-bottom)
    recommendedExample:
      zimlet: zimbra-zimlet-attachment-missing-alert
      reason: Pairs the companion slot with the matching settings field.
    variants:
      - id: component-reference
        summary: Component passed directly.
        examples: [ zimbra-zimlet-additional-signature-setting, zimbra-zimlet-video-call-preferences ]
      - id: inline-handler
        summary: Arrow function returning an element.
        examples: [ zimbra-zimlet-attachment-missing-alert, zimbra-zimlet-modern-welcometour, zimbra-zimlet-voice-composer ]
    notes:
      - The slot name writting-email-additional-settings is spelled that way in the host.
      - Identified by name (setting or preferences in the slot name); check new matches by hand.
  - id: message-processor
    kind: registration
    name: Message processor
    api: plugins.register('messageProcessors:<kind>', () => processor)
    status: complete
    summary: Transform message or event content. Uses bare messageProcessors:<kind> keys. The handler returns the processor, and the host applies it; nothing is rendered.
    usages:
      - { zimlet: zimbra-zimlet-date, registers: [ messageProcessors:emailProcessor, messageProcessors:dateInfoPopover, messageProcessors:attachPopover ], variants: [ content-processor, popover-component, html-transform ] }
      - { zimlet: zimbra-zimlet-deceptive-link-detector, registers: [ messageProcessors:emailProcessor ], variants: [ content-processor ] }
      - { zimlet: zimbra-zimlet-email-defanger, registers: [ messageProcessors:emailProcessor, messageProcessors:eventExcerptProcessor, messageProcessors:eventLocationProcessor, messageProcessors:eventNotesProcessor ], variants: [ content-processor ] }
      - { zimlet: zimbra-zimlet-spy-blocker, registers: [ messageProcessors:emailProcessor, messageProcessors:composerProcessor, messageProcessors:mailPrintProcessor ], variants: [ content-processor ] }
    hostSide:
      reference: ../../../zm-x-web/.agents/zimlet/context/zimlet-slots.yml (kind invoke-plugin, names messageProcessors:*)
      hostFiles:
        - zm-x-web/src/components/html-viewer/index.js
        - zm-x-web/src/hooks/composer/body-wrapper/index.js
        - zm-x-web/src/components/calendar/event-details/event-details.js
    recommendedExample:
      zimlet: zimbra-zimlet-spy-blocker
      reason: Registers the same processor for mail, composer and print, and adds a banner slot.
    variants:
      - id: content-processor
        summary: Handler returns a function that processes the document or text.
        examples: [ zimbra-zimlet-date, zimbra-zimlet-deceptive-link-detector, zimbra-zimlet-email-defanger, zimbra-zimlet-spy-blocker ]
      - id: popover-component
        summary: Handler returns a component used for a date popover.
        examples: [ zimbra-zimlet-date ]
      - id: html-transform
        summary: Handler receives (urlPrefix, isMobileView, sanitized) and returns HTML.
        examples: [ zimbra-zimlet-date ]
    notes:
      - "Keys seen: emailProcessor, composerProcessor, mailPrintProcessor, eventExcerptProcessor, eventLocationProcessor, eventNotesProcessor, dateInfoPopover, attachPopover."
  - id: vertical-route
    kind: registration
    name: Route, tab item or landing page of a vertical
    api: plugins.register('slot::routes' | 'slot::<vertical>-tab-item', handler)
    status: complete
    summary: "Add a screen to Modern UI: a route, a menu item in a tab, or landing-page content."
    usages:
      - { zimlet: zimbra-zimlet-chat, registers: [ slot::routes, slot::chatapps-landing-page ], unregisters: [ slot::chatapps-landing-page, slot::routes ], variants: [ route, landing-page ], files: [ src/components/heartbeat/index.js ] }
      - { zimlet: zimbra-zimlet-org-chart, registers: [ slot::contacts-tab-item, slot::routes ], variants: [ tab-item, route ] }
      - { zimlet: zimbra-zimlet-sideloader, registers: [ slot::routes, slot::integrations-tab-item ], variants: [ route, tab-item ] }
      - { zimlet: zimbra-zimlet-dropbox, registers: [ slot::routes, slot::cloudapps-tab-item ], variants: [ route, tab-item ] }
      - { zimlet: zimbra-zimlet-google-drive, registers: [ slot::routes, slot::cloudapps-tab-item ], variants: [ route, tab-item ] }
      - { zimlet: zimbra-zimlet-jitsi, registers: [ slot::routes, slot::videoapps-tab-item, slot::videoapps-landing-page-description ], variants: [ route, tab-item, landing-page ] }
      - { zimlet: zimbra-zimlet-onedrive, registers: [ slot::routes, slot::cloudapps-tab-item ], variants: [ route, tab-item ] }
      - { zimlet: zimbra-zimlet-slack, registers: [ slot::chatapps-landing-page-description, slot::chatapps-landing-page-videos, slot::routes, slot::chatapps-tab-item ], variants: [ landing-page, route, tab-item ] }
      - { zimlet: zimbra-zimlet-zoom, registers: [ slot::routes, slot::videoapps-landing-page-description, slot::videoapps-tab-item ], variants: [ route, landing-page, tab-item ] }
    hostSide:
      doc: ../../../zm-x-web/.agents/zimlet/reference/verticals.md
      reference: ../../../zm-x-web/.agents/zimlet/context/zimlet-slots.yml (slot routes and the <vertical>-tab-item slots)
    recommendedExample:
      zimlet: zimbra-zimlet-sideloader
      reason: Route, app component and tab item in one small file.
    variants:
      - id: route
        summary: slot::routes handler returns routes.
        examples: [ zimbra-zimlet-chat, zimbra-zimlet-org-chart, zimbra-zimlet-sideloader, zimbra-zimlet-dropbox ]
      - id: tab-item
        summary: slot::<vertical>-tab-item handler returns a menu item.
        examples: [ zimbra-zimlet-org-chart, zimbra-zimlet-sideloader, zimbra-zimlet-dropbox, zimbra-zimlet-google-drive ]
      - id: landing-page
        summary: Landing-page slots of a vertical.
        examples: [ zimbra-zimlet-chat, zimbra-zimlet-jitsi, zimbra-zimlet-slack, zimbra-zimlet-zoom ]
    notes:
      - "Classified by slot name: routes, names ending in -tab-item, names containing landing-page."
  - id: conditional-registration
    kind: modifier
    name: Registered only when a condition holds
    api: ""
    status: complete
    summary: Register only when a condition holds. The check runs in init() before the call.
    usages:
      - { zimlet: zimbra-zimlet-ads, variants: [ state-or-environment-gate ] }
      - { zimlet: zimbra-zimlet-chat, variants: [ state-or-environment-gate, account-gate ] }
      - { zimlet: zimbra-zimlet-date, variants: [ account-gate ] }
      - { zimlet: zimbra-zimlet-desktop-auto-update, variants: [ platform-gate ] }
      - { zimlet: zimbra-zimlet-disable-screen-capture, variants: [ platform-gate ] }
      - { zimlet: zimbra-zimlet-document-editor, variants: [ state-or-environment-gate ] }
      - { zimlet: zimbra-zimlet-external-setting-links, variants: [ state-or-environment-gate, account-gate ] }
      - { zimlet: zimbra-zimlet-mail-translate, variants: [ state-or-environment-gate ] }
      - { zimlet: zimbra-zimlet-org-chart, variants: [ state-or-environment-gate ] }
      - { zimlet: zimbra-zimlet-secure-mail, variants: [ platform-gate ] }
      - { zimlet: zimbra-zimlet-set-default-client, variants: [ platform-gate ] }
      - { zimlet: zimbra-zimlet-voice-composer, variants: [ state-or-environment-gate ] }
      - { zimlet: zimbra-zimlet-web-search, variants: [ state-or-environment-gate ] }
      - { zimlet: zimbra-zimlet-dropbox, variants: [ account-gate ] }
      - { zimlet: zimbra-zimlet-google-drive, variants: [ account-gate ] }
      - { zimlet: zimbra-zimlet-onedrive, variants: [ account-gate ] }
      - { zimlet: zimbra-zimlet-zoom, variants: [ account-gate ] }
    recommendedExample:
      zimlet: zimbra-zimlet-secure-mail
      reason: Platform and license early return before any registration.
    variants:
      - id: platform-gate
        summary: Depends on web, Electron or mobile.
        examples: [ zimbra-zimlet-desktop-auto-update, zimbra-zimlet-disable-screen-capture, zimbra-zimlet-secure-mail, zimbra-zimlet-set-default-client ]
      - id: account-gate
        summary: Depends on account attributes, features or license.
        examples: [ zimbra-zimlet-chat, zimbra-zimlet-date, zimbra-zimlet-external-setting-links, zimbra-zimlet-dropbox ]
      - id: state-or-environment-gate
        summary: Depends on other state or the environment.
        examples: [ zimbra-zimlet-mail-translate, zimbra-zimlet-ads, zimbra-zimlet-chat, zimbra-zimlet-document-editor ]
    notes:
      - Detected lexically around the call. A registration inside a function that init() calls conditionally is not detected (zoom, google-drive).
  - id: async-registration
    kind: modifier
    name: Registered after an asynchronous step
    api: ""
    status: complete
    summary: Register after an asynchronous step, from a promise callback.
    usages:
      - { zimlet: zimbra-zimlet-dropbox, variants: [ after-promise ] }
    recommendedExample:
      zimlet: zimbra-zimlet-dropbox
      reason: Registers after the OAuth script lookup resolves.
    variants:
      - id: after-promise
        summary: registerPlugins runs in a then callback.
        examples: [ zimbra-zimlet-dropbox ]
  - id: dynamic-registration
    kind: modifier
    name: Registered or unregistered at runtime
    api: ""
    status: complete
    summary: Register and unregister at runtime. Pass the same handler reference to unregister.
    usages:
      - { zimlet: zimbra-zimlet-ads, variants: [ component-effect ] }
      - { zimlet: zimbra-zimlet-chat, variants: [ component-effect ] }
      - { zimlet: zimbra-zimlet-org-chart, variants: [ component-effect ] }
      - { zimlet: zimbra-zimlet-web-search, variants: [ component-effect ] }
      - { zimlet: zimbra-zimlet-dropbox, variants: [ store-subscription ] }
      - { zimlet: zimbra-zimlet-google-drive, variants: [ store-subscription ] }
      - { zimlet: zimbra-zimlet-onedrive, variants: [ store-subscription ] }
      - { zimlet: zimbra-zimlet-zoom, variants: [ store-subscription ] }
    recommendedExample:
      zimlet: zimbra-zimlet-google-drive
      reason: Registers and unregisters four slots from store.subscribe.
    variants:
      - id: store-subscription
        summary: Driven by Redux state in store.subscribe.
